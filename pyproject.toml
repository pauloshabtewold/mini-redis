[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-redis"
version = "0.1.0"
description = "A Redis clone from scratch: RESP2 wire protocol on a single-threaded event loop, built in stages toward string and list types, TTL expiry, snapshot persistence, rate limiting and leader-follower replication."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "redis>=5,<9"]
profile = ["py-spy"]

[tool.setuptools]
py-modules = [
    "server",
    "event_loop",
    "connection",
    "resp",
    "store",
    "persistence",
    "ratelimit",
    "replication",
]
packages = ["commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# a parser off-by-one that waits for one byte more than will ever arrive does not fail a
# test, it parks it: the reply never ships and the client waits out its own deadline. that
# turns a one-character regression into a run that hangs until CI's own timeout kills it,
# with no assertion, traceback or log line naming the cause. this bounds it to a failure.
# well above the slowest test here, which is the INCR burst at ~6s against its own 120s cap
timeout = 300
